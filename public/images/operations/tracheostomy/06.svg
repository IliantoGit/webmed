8" stroke-width="3"/></g><g transform="translate(340 198) rotate(-20) scale(0.8)"><rect x="-150" y="-6" width="80" height="12" rx="5" fill="url(#steel)" stroke="#5f6b78" stroke-width="1.3"/><path d="M-70 0 L0 0 Q14 0 12 14 L10 18 L4 10" fill="none" stroke="#5f6b78" stroke-width="3"/></g><polyline class="lead" points="300,198 40,90" marker-start="url(#dot)"/><text class="lbl" x="44" y="94" text-anchor="start"><tspan x="44" dy="0">острые однозубые крючки</tspan><tspan x="44" dy="14">(Шассеньяка) — в 1–2 кольцо</tspan><tspan x="44" dy="14">по сторонам от средней линии</tspan></text><text class="lbl sm" x="40" y="350" text-anchor="start" style="fill:#16a34a"><tspan x="40" dy="0">перед вскрытием — тщательный гемостаз</tspan></text><text class="ttl" x="18" y="28">Фиксация трахеи</text></svg>
