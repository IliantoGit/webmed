<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Вскрытие трахеи">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M270 50 L370 50 L345 135 L320 145 L295 135 Z" fill="#e6eef5" stroke="#8aa0b6" stroke-width="2" /><rect x="285" y="160" width="70" height="16" rx="6" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="298" y="145" width="44" height="14" rx="0" fill="#dfe8f0" stroke="#8aa0b6" stroke-width="0.8"/><rect x="292" y="186" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="206" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="226" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="246" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="266" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="286" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="306" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="326" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="346" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><rect x="292" y="366" width="56" height="12" rx="5" fill="#e6eef5" stroke="#8aa0b6" stroke-width="1.2"/><path d="M250 170 Q230 230 260 280 Q285 290 295 250 L295 250 L345 250 L345 250 Q355 290 380 280 Q410 230 390 170 Q370 160 350 185 L350 245 L290 245 L290 185 Q270 160 250 170 Z" fill="#c9564d" stroke="#8f2f28" stroke-width="1.5" fill-opacity="0.85"/><rect x="290" y="245" width="60" height="40" rx="0" fill="#c9564d" stroke="#8f2f28" stroke-width="1.5"/><path d="M308 188 L332 188 L336 222 L304 222 Z" fill="#1f2d26" /><g transform="translate(320 225) rotate(-90) scale(0.8)"><rect x="-150" y="-6" width="110" height="12" rx="4" fill="url(#steel)" stroke="#5f6b78" stroke-width="1.3"/><path d="M-40 -6 L-8 -9 Q4 -6 0 2 L-40 6 Z" fill="#f8fafc" stroke="#5f6b78" stroke-width="1.3"/></g><path d="M470 260 L470 190" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/><polyline class="lead" points="320,205 40,90" marker-start="url(#dot)"/><text class="lbl" x="44" y="94" text-anchor="start"><tspan x="44" dy="0">рассечены 2 кольца</tspan><tspan x="44" dy="14">снизу вверх; края хряща</tspan><tspan x="44" dy="14">иссечены — овальное окно</tspan></text><polyline class="lead" points="320,260 400,70" marker-start="url(#dot)"/><text class="lbl sm" x="404" y="74" text-anchor="start"><tspan x="404" dy="0">остроконечный скальпель:</tspan><tspan x="404" dy="14">не более 1 см свободного</tspan><tspan x="404" dy="14">лезвия — не ранить</tspan><tspan x="404" dy="14">заднюю стенку</tspan></text><text class="ttl" x="18" y="28">Вскрытие трахеи</text></svg>
