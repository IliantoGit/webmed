<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Белая линия шеи">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><g><ellipse cx="320" cy="210" rx="136" ry="187" fill="#f6d5c3" stroke="#d9a58c" stroke-width="2"/><ellipse cx="320" cy="210" rx="120" ry="173" fill="url(#fatp)"/><ellipse cx="320" cy="210" rx="110" ry="165" fill="url(#fibh)" stroke="#e8c766" stroke-width="1.5"/></g><path d="M318 50 L322 370" fill="none" stroke="#f1f5f9" stroke-width="10" /><g transform="translate(320 320) rotate(-90) scale(1.2)"><rect x="-150" y="-6" width="30" height="12" rx="3" fill="url(#steel)" stroke="#5f6b78" stroke-width="1.3"/><path d="M-120 -4 L-4 -4 Q4 0 -4 4 L-120 4 Z" fill="url(#steel)" stroke="#5f6b78" stroke-width="1.3"/><line x1="-115" y1="0" x2="-8" y2="0" stroke="#5f6b78" stroke-width="1"/></g><path d="M320 70 L320 330" fill="none" stroke="#d62828" stroke-width="3" stroke-dasharray="9 6" stroke-linecap="round"/><g transform="translate(250 200) rotate(180) scale(0.6)"><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#9aa7b4" stroke-width="9" stroke-linecap="round"/><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#5f6b78" stroke-width="1.2"/></g><g transform="translate(390 220) rotate(0) scale(0.6)"><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#9aa7b4" stroke-width="9" stroke-linecap="round"/><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#5f6b78" stroke-width="1.2"/></g><polyline class="lead" points="320,120 430,70" marker-start="url(#dot)"/><text class="lbl" x="434" y="74" text-anchor="start"><tspan x="434" dy="0">белая линия шеи —</tspan><tspan x="434" dy="14">рассечь по желобоватому</tspan><tspan x="434" dy="14">зонду строго продольно</tspan></text><polyline class="lead" points="270,260 40,330" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="334" text-anchor="start"><tspan x="44" dy="0">грудино-подъязычные и</tspan><tspan x="44" dy="14">грудино-щитовидные мышцы</tspan></text><polyline class="lead" points="390,220 450,300" marker-start="url(#dot)"/><text class="lbl sm" x="454" y="304" text-anchor="start"><tspan x="454" dy="0">пластинчатые крючки</tspan><tspan x="454" dy="14">Фарабефа</tspan></text><text class="ttl" x="18" y="28">Белая линия шеи</text></svg>
