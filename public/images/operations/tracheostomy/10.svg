ransform="translate(320 152) rotate(-90) scale(0.6)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><polyline class="lead" points="320,152 400,70" marker-start="url(#dot)"/><text class="lbl" x="404" y="74" text-anchor="start"><tspan x="404" dy="0">коническая связка между</tspan><tspan x="404" dy="14">щитовидным и перстневидным</tspan><tspan x="404" dy="14">хрящами — рассечь</tspan></text><polyline class="lead" points="318,215 40,300" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="304" text-anchor="start"><tspan x="44" dy="0">в разрез ввести зажим</tspan><tspan x="44" dy="14">и развести бранши</tspan></text><text class="lbl sm" x="40" y="370" text-anchor="start" style="fill:#16a34a"><tspan x="40" dy="0">после устранения асфиксии — обычная трахеостомия</tspan></text><text class="ttl" x="18" y="28">Экстренно: коникотомия</text></svg>
