<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Бильрот I: отсечение желудка">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M178 228 L120 232 Q70 245 72 300 Q80 365 170 368" fill="none" stroke="#c97d72" stroke-width="36" stroke-linecap="round"/><path d="M178 228 L120 232 Q70 245 72 300 Q80 365 170 368" fill="none" stroke="#f4bcb3" stroke-width="32" stroke-linecap="round"/><path d="M400 85 Q430 40 490 55 Q560 80 545 170 Q530 280 420 315 Q300 345 210 290 L170 270 L178 225 Q250 245 300 215 Q360 175 380 100 Z" fill="#f2aaa2" stroke="#b8655c" stroke-width="2" /><path d="M170 270 L178 225 Q250 245 300 215 L345 175 L420 315 Q300 345 210 290 Z" fill="#ffffff" fill-opacity="0.35"/><g transform="translate(395 305) rotate(-70) scale(0.55)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><g transform="translate(345 180) rotate(110) scale(0.55)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><path d="M318 205 L410 320" fill="none" stroke="#444" stroke-width="10" stroke-linecap="round" stroke-opacity="0.75"/><path d="M335 185 L425 312" fill="none" stroke="#d62828" stroke-width="3" stroke-dasharray="9 6" stroke-linecap="round"/><g transform="translate(160 240) rotate(90) scale(0.5)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><g transform="translate(145 242) rotate(90) scale(0.5)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><polyline class="lead" points="398,300 429.6,360" marker-start="url(#dot)"/><text class="lbl sm" x="433.6" y="364" text-anchor="start"><tspan x="433.6" dy="0">зажим со стороны большой</tspan><tspan x="433.6" dy="14">кривизны — по ширине анастомоза</tspan></text><polyline class="lead" points="348,185 430,120" marker-start="url(#dot)"/><text class="lbl sm" x="434" y="124" text-anchor="start"><tspan x="434" dy="0">второй зажим — остальная</tspan><tspan x="434" dy="14">часть со стороны малой кривизны</tspan></text><polyline class="lead" points="360,260 30,70" marker-start="url(#dot)"/><text class="lbl sm" x="34" y="74" text-anchor="start"><tspan x="34" dy="0">жом Пайра на удаляемую часть;</tspan><tspan x="34" dy="14">отсечение по его краю</tspan></text><polyline class="lead" points="152,240 30,330" marker-start="url(#dot)"/><text class="lbl sm" x="34" y="334" text-anchor="start"><tspan x="34" dy="0">ДПК пересечена между</tspan><tspan x="34" dy="14">кишечными жомами</tspan></text><text class="ttl" x="18" y="28">Бильрот I: отсечение желудка</text></svg>
