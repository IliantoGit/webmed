<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Бильрот II: обработка культи ДПК">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M60 150 L360 150 Q400 150 400 200 Q400 250 360 250 L60 250 Z" fill="#f4bcb3" stroke="#c97d72" stroke-width="2" /><path d="M380 150 L386 155 L398 165 L386 175 L398 185 L386 195 L398 205 L386 215 L398 225 L386 235 L398 245" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 145 Q430 200 330 255" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M300 140 Q470 200 300 260" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M60 270 Q300 300 470 280 L470 320 Q300 340 60 320 Z" fill="#f2d38c" stroke="#c9a24a" stroke-width="1.5" /><polyline class="lead" points="392,200 430,80" marker-start="url(#dot)"/><text class="lbl sm" x="434" y="84" text-anchor="start"><tspan x="434" dy="0">непрерывный обвивной шов</tspan><tspan x="434" dy="14">культи поверх зажима</tspan></text><polyline class="lead" points="430,200 430,160" marker-start="url(#dot)"/><text class="lbl sm" x="434" y="164" text-anchor="start"><tspan x="434" dy="0">погружение: Z-образный +</tspan><tspan x="434" dy="14">кисетный или два</tspan><tspan x="434" dy="14">полукисетных шва</tspan></text><polyline class="lead" points="300,300 40,370" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="374" text-anchor="start"><tspan x="44" dy="0">культю дополнительно подшивают</tspan><tspan x="44" dy="14">к капсуле поджелудочной железы</tspan></text><text class="lbl sm" x="70" y="130" text-anchor="start"><tspan x="70" dy="0">культя двенадцатиперстной кишки</tspan></text><text class="ttl" x="18" y="28">Бильрот II: обработка культи ДПК</text></svg>
