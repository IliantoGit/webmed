<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Мобилизация начального отдела двенадцатиперстной кишки">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M90 330 Q300 300 560 320 Q560 370 300 375 Q120 380 90 360 Z" fill="#f2d38c" stroke="#c9a24a" stroke-width="2" /><text class="lbl sm" x="420" y="360" text-anchor="start"><tspan x="420" dy="0">головка поджелудочной железы</tspan></text><path d="M120 170 L560 170" fill="none" stroke="#c97d72" stroke-width="80" stroke-linecap="round"/><path d="M120 170 L560 170" fill="none" stroke="#f4bcb3" stroke-width="74" stroke-linecap="round"/><path d="M330 130 Q332 170 330 210" fill="none" stroke="#b8655c" stroke-width="6" /><text class="lbl sm" x="400" y="120" text-anchor="start"><tspan x="400" dy="0">желудок (антральный отдел) →</tspan></text><text class="lbl sm" x="70" y="120" text-anchor="start"><tspan x="70" dy="0">← двенадцатиперстная кишка</tspan></text><path d="M250 380 Q245 300 240 220" fill="none" stroke="#d62828" stroke-width="5" /><path d="M242 265 Q200 245 200 225" fill="none" stroke="#d62828" stroke-width="2.5" /><line x1="190" y1="233" x2="210" y2="233" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="200.0" cy="233.0" r="4" fill="#2563eb"/><path d="M242 268 Q240 248 240 228" fill="none" stroke="#d62828" stroke-width="2.5" /><line x1="230" y1="236" x2="250" y2="236" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="240.0" cy="236.0" r="4" fill="#2563eb"/><path d="M242 265 Q280 245 280 225" fill="none" stroke="#d62828" stroke-width="2.5" /><line x1="270" y1="233" x2="290" y2="233" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="280.0" cy="233.0" r="4" fill="#2563eb"/><polyline class="lead" points="244,300 40,300" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="304" text-anchor="start"><tspan x="44" dy="0">a. gastroduodenalis</tspan></text><polyline class="lead" points="240,236 380,230" marker-start="url(#dot)"/><text class="lbl" x="384" y="234" text-anchor="start"><tspan x="384" dy="0">2–3 ветви к задней стенке</tspan><tspan x="384" dy="14">двенадцатиперстной кишки —</tspan><tspan x="384" dy="14">перевязать и пересечь</tspan></text><text class="ttl" x="18" y="28">Мобилизация начального отдела двенадцатиперстной кишки</text></svg>
