<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Тупое разведение мышц">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><g transform="rotate(35 300 210)"><ellipse cx="300" cy="210" rx="196" ry="97" fill="#f6d5c3" stroke="#d9a58c" stroke-width="2"/><ellipse cx="300" cy="210" rx="180" ry="83" fill="url(#fatp)"/><ellipse cx="300" cy="210" rx="170" ry="75" fill="url(#fib)" stroke="#e8c766" stroke-width="1.5"/></g><ellipse cx="300" cy="210" rx="40" ry="95" transform="rotate(-50 300 210)" fill="url(#fibh)" stroke="#c46f62" stroke-width="2"/><ellipse cx="300" cy="210" rx="16" ry="60" transform="rotate(-50 300 210)" fill="#bfe3cf"/><path d="M300 210 L230 150" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M300 210 L370 270" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/><g transform="translate(215 140) rotate(210) scale(0.7)"><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#9aa7b4" stroke-width="9" stroke-linecap="round"/><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#5f6b78" stroke-width="1.2"/></g><g transform="translate(385 280) rotate(30) scale(0.7)"><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#9aa7b4" stroke-width="9" stroke-linecap="round"/><path d="M-160 0 L-10 0 Q0 0 0 10 L0 30" fill="none" stroke="#5f6b78" stroke-width="1.2"/></g><polyline class="lead" points="250,250 163.20000000000002,330" marker-start="url(#dot)"/><text class="lbl" x="159.20000000000002" y="334" text-anchor="end"><tspan x="159.20000000000002" dy="0">внутренняя косая</tspan><tspan x="159.20000000000002" dy="14">мышца (волокна</tspan><tspan x="159.20000000000002" dy="14">поперёк разреза кожи)</tspan></text><polyline class="lead" points="300,215 470,130" marker-start="url(#dot)"/><text class="lbl" x="474" y="134" text-anchor="start"><tspan x="474" dy="0">поперечная фасция</tspan><tspan x="474" dy="14">и брюшина в глубине</tspan></text><text class="lbl sm" x="400" y="350" text-anchor="start" style="fill:#16a34a"><tspan x="400" dy="0">Мышцы НЕ пересекают —</tspan><tspan x="400" dy="15">разводят тупо по ходу волокон</tspan></text><text class="ttl" x="18" y="28">Тупое разведение мышц</text></svg>
