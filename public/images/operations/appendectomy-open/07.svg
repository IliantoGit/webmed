<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Обработка брыжейки отростка">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M180 30 Q130 40 125 110 Q115 210 190 230 Q270 240 280 160 Q285 80 245 30 Z" fill="#ecc9a8" stroke="#b98a5c" stroke-width="2" /><path d="M208 32 Q210 140 220 228" fill="none" stroke="#b98a5c" stroke-width="5" stroke-opacity="0.45"/><path d="M145 60 Q160 160 218 230" fill="none" stroke="#b98a5c" stroke-width="1" stroke-dasharray="4 4"/><path d="M430 100 Q350 110 280 130" fill="none" stroke="#c97d72" stroke-width="34" stroke-linecap="round"/><path d="M430 100 Q350 110 280 130" fill="none" stroke="#f4bcb3" stroke-width="30" stroke-linecap="round"/><path d="M222 228 Q240 290 310 310 Q360 320 390 300 L320 160 Z" fill="#f7e3a8" stroke="#d8b964" stroke-width="1.2" /><path d="M320 162 Q320 250 375 298" fill="none" stroke="#d62828" stroke-width="2.5" /><path d="M321 210 Q300 260 280 290" fill="none" stroke="#d62828" stroke-width="1.8" /><path d="M222 228 Q240 290 310 310 Q360 320 390 300" fill="none" stroke="#c97d72" stroke-width="20" stroke-linecap="round"/><path d="M222 228 Q240 290 310 310 Q360 320 390 300" fill="none" stroke="#f0a69b" stroke-width="16" stroke-linecap="round"/><g transform="translate(392 300) rotate(20) scale(0.6)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><line x1="300" y1="215" x2="330" y2="190" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="315.0" cy="202.5" r="4" fill="#2563eb"/><line x1="335" y1="240" x2="365" y2="215" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="350.0" cy="227.5" r="4" fill="#2563eb"/><g transform="translate(330 165) rotate(200) scale(0.7)"><line x1="-70" y1="0" x2="0" y2="0" stroke="#5f6b78" stroke-width="2.5"/><rect x="-86" y="-5" width="16" height="10" fill="#9aa7b4" stroke="#5f6b78" stroke-width="1.3"/><path d="M-86 0 C-130 0 -120 50 -180 50" fill="none" stroke="#c9a37a" stroke-width="5"/><rect x="-110" y="-14" width="10" height="28" rx="2" fill="#1f2d26"/></g><polyline class="lead" points="392,300 450,360" marker-start="url(#dot)"/><text class="lbl" x="454" y="364" text-anchor="start"><tspan x="454" dy="0">зажим на брыжейке</tspan><tspan x="454" dy="14">у верхушки — держалка</tspan></text><polyline class="lead" points="320,160 450,70" marker-start="url(#dot)"/><text class="lbl" x="454" y="74" text-anchor="start"><tspan x="454" dy="0">брыжейка отростка:</tspan><tspan x="454" dy="14">15–20 мл 0,25% прокаина</tspan></text><polyline class="lead" points="318,238 433.6,200" marker-start="url(#dot)"/><text class="lbl" x="437.6" y="204" text-anchor="start"><tspan x="437.6" dy="0">лигатуры на брыжейке —</tspan><tspan x="437.6" dy="14">культя не слишком короткая!</tspan></text><polyline class="lead" points="320,260 470,290" marker-start="url(#dot)"/><text class="lbl sm" x="474" y="294" text-anchor="start"><tspan x="474" dy="0">a. appendicularis</tspan></text><text class="ttl" x="18" y="28">Обработка брыжейки отростка</text></svg>
