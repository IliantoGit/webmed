<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Перевязка основания и кисетный шов">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M180 30 Q130 40 125 110 Q115 210 190 230 Q270 240 280 160 Q285 80 245 30 Z" fill="#ecc9a8" stroke="#b98a5c" stroke-width="2" /><path d="M208 32 Q210 140 220 228" fill="none" stroke="#b98a5c" stroke-width="5" stroke-opacity="0.45"/><path d="M145 60 Q160 160 218 230" fill="none" stroke="#b98a5c" stroke-width="1" stroke-dasharray="4 4"/><path d="M430 100 Q350 110 280 130" fill="none" stroke="#c97d72" stroke-width="34" stroke-linecap="round"/><path d="M430 100 Q350 110 280 130" fill="none" stroke="#f4bcb3" stroke-width="30" stroke-linecap="round"/><path d="M222 228 Q240 290 310 310 Q360 320 390 300" fill="none" stroke="#c97d72" stroke-width="20" stroke-linecap="round"/><path d="M222 228 Q240 290 310 310 Q360 320 390 300" fill="none" stroke="#f0a69b" stroke-width="16" stroke-linecap="round"/><ellipse cx="222" cy="232" rx="42" ry="30" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 5"/><line x1="214" y1="238" x2="238" y2="246" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="226.0" cy="242.0" r="4" fill="#2563eb"/><polyline class="lead" points="222,202 380,70" marker-start="url(#dot)"/><text class="lbl" x="384" y="74" text-anchor="start"><tspan x="384" dy="0">кисетный серозно-мышечный</tspan><tspan x="384" dy="14">шов в 1,5 см от основания</tspan><tspan x="384" dy="14">(не затягивают)</tspan></text><polyline class="lead" points="226,242 380,300" marker-start="url(#dot)"/><text class="lbl" x="384" y="304" text-anchor="start"><tspan x="384" dy="0">основание отростка</tspan><tspan x="384" dy="14">пережато и перевязано</tspan><tspan x="384" dy="14">в бороздке</tspan></text><text class="ttl" x="18" y="28">Перевязка основания и кисетный шов</text></svg>
