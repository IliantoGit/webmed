<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M170 40 Q160 160 175 260 Q185 330 230 372 L410 372 Q455 330 465 260 Q480 160 470 40 Z" fill="#f6d5c3" stroke="#d9a58c" stroke-width="2" /><path d="M178 120 Q250 175 320 112 Q390 175 462 120" fill="none" stroke="#d9a58c" stroke-width="2" stroke-dasharray="5 5"/><text class="lbl sm" x="206" y="104" text-anchor="start" style="fill:#5b7266"><tspan x="206" dy="0">рёберная дуга</tspan></text><path d="M320 70 L320 365" fill="none" stroke="#d9a58c" stroke-width="1.2" stroke-dasharray="3 6"/><path d="M215 300 Q250 335 300 365" fill="none" stroke="#d9a58c" stroke-width="2" /><path d="M425 300 Q390 335 340 365" fill="none" stroke="#d9a58c" stroke-width="2" /><circle cx="215" cy="300" r="4" fill="#d9a58c"/><circle cx="425" cy="300" r="4" fill="#d9a58c"/><ellipse cx="320" cy="200" rx="6" ry="8" fill="#d9a58c"/><text class="lbl sm" x="150" y="392" text-anchor="start" style="fill:#5b7266"><tspan x="150" dy="0">← правая сторона пациента</tspan></text><path d="M320 200 L215 300" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><path d="M228 242 L293 304" fill="none" stroke="#d62828" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/><circle cx="250" cy="263" r="6" fill="#d62828"/><polyline class="lead" points="320,200 360,175" marker-start="url(#dot)"/><text class="lbl" x="364" y="179" text-anchor="start"><tspan x="364" dy="0">пупок</tspan></text><polyline class="lead" points="215,300 127.2,330" marker-start="url(#dot)"/><text class="lbl" x="123.2" y="334" text-anchor="end"><tspan x="123.2" dy="0">передняя верхняя</tspan><tspan x="123.2" dy="14">подвздошная ость</tspan></text><polyline class="lead" points="250,263 134.4,220" marker-start="url(#dot)"/><text class="lbl" x="130.4" y="224" text-anchor="end"><tspan x="130.4" dy="0">точка Мак-Бёрнея</tspan><tspan x="130.4" dy="14">(граница наружной</tspan><tspan x="130.4" dy="14">и средней трети)</tspan></text><polyline class="lead" points="285,296 500,300" marker-start="url(#dot)"/><text class="lbl" x="504" y="304" text-anchor="start"><tspan x="504" dy="0">разрез 8–10 см:</tspan><tspan x="504" dy="14">1/3 выше линии,</tspan><tspan x="504" dy="14">2/3 ниже</tspan></text><text class="lbl sm" x="470" y="150" text-anchor="start" style="fill:#16a34a"><tspan x="470" dy="0">линия пупок —</tspan><tspan x="470" dy="15">подвздошная ость</tspan></text></svg>
