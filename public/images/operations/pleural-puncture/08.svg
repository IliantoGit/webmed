<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><rect x="40" y="80" width="560" height="40" rx="0" fill="#f6d5c3"/><path d="M40 100 L600 100 L600 330 Q330 360 40 330 Z" fill="#f2c7c9" /><path d="M40 230 L600 230 L600 330 Q330 360 40 330 Z" fill="#bcdcf5" /><path d="M40 330 Q330 360 600 330 L600 400 L40 400 Z" fill="#b5543c" /><text class="lbl sm" x="560" y="220" text-anchor="end"><tspan x="560" dy="0">лёгкое</tspan></text><text class="lbl sm" x="560" y="300" text-anchor="end"><tspan x="560" dy="0">выпот</tspan></text><text class="lbl sm" x="560" y="385" text-anchor="end" style="fill:#fff; stroke:#3a1a12; stroke-opacity:0.55"><tspan x="560" dy="0">диафрагма / печень</tspan></text><path d="M100 78 L100 280" fill="none" stroke="#16a34a" stroke-width="3" /><text class="lbl sm" x="100" y="48" text-anchor="middle" style="fill:#16a34a"><tspan x="100" dy="0">✓ в выпот</tspan></text><path d="M240 78 L240 200" fill="none" stroke="#d62828" stroke-width="3" /><text class="lbl sm" x="240" y="48" text-anchor="middle" style="fill:#d62828"><tspan x="240" dy="0">✗ в лёгкое</tspan><tspan x="240" dy="15">(над выпотом)</tspan></text><path d="M380 78 L380 380" fill="none" stroke="#d62828" stroke-width="3" /><text class="lbl sm" x="380" y="48" text-anchor="middle" style="fill:#d62828"><tspan x="380" dy="0">✗ через синус</tspan><tspan x="380" dy="15">в брюшную полость</tspan></text><path d="M520 78 L520 225" fill="none" stroke="#d62828" stroke-width="3" /><text class="lbl sm" x="520" y="48" text-anchor="middle" style="fill:#d62828"><tspan x="520" dy="0">✗ над выпотом /</tspan><tspan x="520" dy="15">в спайку</tspan></text></svg>
