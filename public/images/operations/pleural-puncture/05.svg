<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Герметичная система для пункции">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><g transform="translate(120 200) rotate(180) scale(1)"><line x1="-120" y1="0" x2="0" y2="0" stroke="#5f6b78" stroke-width="2.5"/><rect x="-136" y="-5" width="16" height="10" fill="#9aa7b4" stroke="#5f6b78" stroke-width="1.3"/><path d="M-136 0 C-180 0 -170 50 -230 50" fill="none" stroke="#c9a37a" stroke-width="5"/><rect x="-160" y="-14" width="10" height="28" rx="2" fill="#1f2d26"/></g><path d="M240 200 Q300 200 330 200" fill="none" stroke="#c9a37a" stroke-width="6" /><g transform="translate(300 200) rotate(70) scale(0.5)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><rect x="330" y="180" width="140" height="40" rx="6" fill="#f8fafc" stroke="#5f6b78" stroke-width="2"/><rect x="470" y="192" width="90" height="16" rx="3" fill="#9aa7b4"/><rect x="350" y="186" width="90" height="28" rx="0" fill="#fde68a"/><polyline class="lead" points="120,200 60,120" marker-start="url(#dot)"/><text class="lbl sm" x="64" y="124" text-anchor="start"><tspan x="64" dy="0">длинная толстая игла</tspan></text><polyline class="lead" points="285,200 230,300" marker-start="url(#dot)"/><text class="lbl" x="234" y="304" text-anchor="start"><tspan x="234" dy="0">резиновая трубка 10–15 см</tspan><tspan x="234" dy="14">с зажимом (или кран)</tspan></text><polyline class="lead" points="400,190 430,120" marker-start="url(#dot)"/><text class="lbl sm" x="434" y="124" text-anchor="start"><tspan x="434" dy="0">шприц</tspan></text><text class="lbl sm" x="40" y="370" text-anchor="start" style="fill:#d62828"><tspan x="40" dy="0">Перед КАЖДЫМ отсоединением шприца трубку пережимают —</tspan><tspan x="40" dy="15">иначе в плевральную полость засасывается воздух</tspan></text><text class="ttl" x="18" y="28">Герметичная система для пункции</text></svg>
