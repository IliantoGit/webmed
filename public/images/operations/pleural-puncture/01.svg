th="2" stroke-opacity="0.7"/><path d="M310 342 Q220 352 170 376" fill="none" stroke="#b9a77f" stroke-width="2" stroke-opacity="0.7"/><path d="M360 70 L430 80 L410 190 Z" fill="#e9d8c4" stroke="#b9a77f" stroke-width="1.5" fill-opacity="0.7"/><path d="M400 120 L400 380" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M455 120 L455 380" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M175 260 Q320 300 470 260" fill="none" /><path d="M330 255 Q420 262 475 300 L470 380 L330 380 Z" fill="#9ec9f0" fill-opacity="0.45"/><circle cx="430" cy="300" r="8" fill="#d62828"/><polyline class="lead" points="400,140 470,60" marker-start="url(#dot)"/><text class="lbl sm" x="474" y="64" text-anchor="start"><tspan x="474" dy="0">лопаточная линия</tspan></text><polyline class="lead" points="455,160 500,110" marker-start="url(#dot)"/><text class="lbl sm" x="504" y="114" text-anchor="start"><tspan x="504" dy="0">средняя подмышечная</tspan><tspan x="504" dy="14">линия (сбоку)</tspan></text><polyline class="lead" points="430,300 448.0,220" marker-start="url(#dot)"/><text class="lbl" x="452.0" y="224" text-anchor="start"><tspan x="452.0" dy="0">жидкость: 7–8 межреберье</tspan><tspan x="452.0" dy="14">между средней подмышечной</tspan><tspan x="452.0" dy="14">и лопаточной линиями</tspan></text><polyline class="lead" points="400,330 30,300" marker-start="url(#dot)"/><text class="lbl sm" x="34" y="304" text-anchor="start"><tspan x="34" dy="0">выпот (уровень</tspan><tspan x="34" dy="14">уточнить перкуссией</tspan><tspan x="34" dy="14">и рентгенологически)</tspan></text><text class="lbl sm" x="30" y="60" text-anchor="start" style="fill:#16a34a"><tspan x="30" dy="0">воздух: 2–3 межреберье</tspan><tspan x="30" dy="15">по среднеключичной линии (спереди)</tspan></text><text class="ttl" x="18" y="28">Выбор точки пункции (вид сзади, правая сторона)</text></svg>
