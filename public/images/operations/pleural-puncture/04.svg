<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Прокол грудной стенки">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><rect x="40" y="60" width="560" height="26" rx="0" fill="#f6d5c3"/><rect x="40" y="86" width="560" height="30" rx="0" fill="url(#fatp)"/><rect x="40" y="116" width="560" height="40" rx="0" fill="url(#fib2)"/><ellipse cx="150" cy="185" rx="70" ry="34" fill="#f5efe0" stroke="#b9a77f" stroke-width="2"/><ellipse cx="490" cy="185" rx="70" ry="34" fill="#f5efe0" stroke="#b9a77f" stroke-width="2"/><rect x="220" y="156" width="200" height="60" rx="0" fill="url(#fib)"/><circle cx="200" cy="214" r="7" fill="#3a6ea5"/><circle cx="214" cy="222" r="6" fill="#d62828"/><circle cx="226" cy="228" r="5" fill="#e9b824"/><rect x="40" y="236" width="560" height="6" rx="0" fill="#eef2f7"/><rect x="40" y="242" width="560" height="5" rx="0" fill="#bfe3cf"/><rect x="40" y="247" width="560" height="70" rx="0" fill="#bcdcf5"/><text class="lbl sm" x="470" y="290" text-anchor="start"><tspan x="470" dy="0">выпот</tspan></text><rect x="40" y="317" width="560" height="6" rx="0" fill="#bfe3cf"/><rect x="40" y="323" width="560" height="60" rx="0" fill="#f2c7c9"/><text class="lbl sm" x="470" y="360" text-anchor="start"><tspan x="470" dy="0">лёгкое</tspan></text><text class="lbl sm" x="150" y="190" text-anchor="middle"><tspan x="150" dy="0">ребро</tspan><tspan x="150" dy="15">(верхнее)</tspan></text><text class="lbl sm" x="490" y="190" text-anchor="middle"><tspan x="490" dy="0">ребро</tspan><tspan x="490" dy="15">(нижнее)</tspan></text><polyline class="lead" points="214,222 40,300" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="304" text-anchor="start"><tspan x="44" dy="0">межрёберные вена, артерия,</tspan><tspan x="44" dy="14">нерв — у НИЖНЕГО края ребра</tspan></text><g transform="translate(425 268) rotate(90) scale(0.95)"><line x1="-190" y1="0" x2="0" y2="0" stroke="#5f6b78" stroke-width="2.5"/><rect x="-206" y="-5" width="16" height="10" fill="#9aa7b4" stroke="#5f6b78" stroke-width="1.3"/><path d="M-206 0 C-250 0 -240 50 -300 50" fill="none" stroke="#c9a37a" stroke-width="5"/><rect x="-230" y="-14" width="10" height="28" rx="2" fill="#1f2d26"/></g><polyline class="lead" points="425,236 462.4,40" marker-start="url(#dot)"/><text class="lbl" x="466.4" y="44" text-anchor="start"><tspan x="466.4" dy="0">игла — по ВЕРХНЕМУ краю</tspan><tspan x="466.4" dy="14">нижележащего ребра,</tspan><tspan x="466.4" dy="14">перпендикулярно коже</tspan></text><polyline class="lead" points="425,244 440,300" marker-start="url(#dot)"/><text class="lbl sm" x="444" y="304" text-anchor="start"><tspan x="444" dy="0">на глубине 3–5 см —</tspan><tspan x="444" dy="14">прокол париетальной</tspan><tspan x="444" dy="14">плевры («провал»)</tspan></text><text class="ttl" x="18" y="28">Прокол грудной стенки</text></svg>
