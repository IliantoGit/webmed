 fill="none" stroke="#5f6b78" stroke-width="3"/></g><polyline class="lead" points="350,178 440,210" marker-start="url(#dot)"/><text class="lbl" x="444" y="214" text-anchor="start"><tspan x="444" dy="0">две лигатуры — пересечь</tspan><tspan x="444" dy="14">артерию между ними</tspan></text><text class="ttl" x="18" y="28">Перевязка пузырной артерии</text></svg>
