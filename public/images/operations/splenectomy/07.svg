<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Ложе после удаления">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M60 62 Q330 22 620 62" fill="none" stroke="#c46f62" stroke-width="10" stroke-opacity="0.5"/><text class="lbl sm" x="615" y="80" text-anchor="end" style="fill:#5b7266"><tspan x="615" dy="0">диафрагма</tspan></text><path d="M60 80 Q200 50 280 120 Q320 200 280 290 Q200 360 80 340 Z" fill="#f2aaa2" stroke="#b8655c" stroke-width="2" /><text class="lbl" x="110" y="210" text-anchor="start"><tspan x="110" dy="0">желудок</tspan></text><path d="M60 340 Q250 300 430 290 Q470 290 470 310 Q440 330 260 350 Q140 370 60 375 Z" fill="#f2d38c" stroke="#c9a24a" stroke-width="1.5" /><text class="lbl sm" x="200" y="372" text-anchor="start"><tspan x="200" dy="0">поджелудочная железа (хвост)</tspan></text><path d="M60 320 Q250 285 420 270 Q440 260 455 230" fill="none" stroke="#d62828" stroke-width="6" /><path d="M420 270 Q440 210 462 195" fill="none" stroke="#d62828" stroke-width="3" /><path d="M420 270 Q440 250 462 235" fill="none" stroke="#d62828" stroke-width="3" /><path d="M420 270 Q440 290 462 275" fill="none" stroke="#d62828" stroke-width="3" /><path d="M60 335 Q250 300 425 290 Q448 285 462 262" fill="none" stroke="#3a6ea5" stroke-width="7" /><path d="M420 70 Q560 40 600 150 Q620 260 530 330 Q470 360 440 320 Q470 270 455 200 Q440 140 400 120 Q390 85 420 70 Z" fill="none" stroke="#8e3b4f" stroke-width="2" stroke-dasharray="6 5"/><circle cx="432" cy="252" r="5" fill="#2563eb"/><circle cx="440" cy="270" r="5" fill="#2563eb"/><circle cx="448" cy="290" r="5" fill="#2563eb"/><polyline class="lead" points="520,60 470,110" marker-start="url(#dot)"/><text class="lbl sm" x="474" y="114" text-anchor="start"><tspan x="474" dy="0">гемостаз: особенно</tspan><tspan x="474" dy="14">купол диафрагмы</tspan></text><polyline class="lead" points="440,300 470,350" marker-start="url(#dot)"/><text class="lbl sm" x="474" y="354" text-anchor="start"><tspan x="474" dy="0">культи сосудов</tspan><tspan x="474" dy="14">перитонизировать</tspan></text><polyline class="lead" points="430,300 60,120" marker-start="url(#dot)"/><text class="lbl sm" x="64" y="124" text-anchor="start"><tspan x="64" dy="0">проверить хвост</tspan><tspan x="64" dy="14">поджелудочной железы</tspan></text><text class="ttl" x="18" y="28">Ложе после удаления</text></svg>
