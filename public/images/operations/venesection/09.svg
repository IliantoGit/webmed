<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Фиксация и завершение">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><rect x="30" y="60" width="580" height="320" rx="20" fill="#f6d5c3" stroke="#d9a58c" stroke-width="2"/><path d="M150 210 L490 210" fill="none" stroke="#d9a58c" stroke-width="3" /><path d="M170 196 L170 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="196" r="2.5" fill="#2563eb"/><path d="M210 196 L210 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="196" r="2.5" fill="#2563eb"/><path d="M250 196 L250 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="196" r="2.5" fill="#2563eb"/><path d="M290 196 L290 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="196" r="2.5" fill="#2563eb"/><path d="M330 196 L330 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="196" r="2.5" fill="#2563eb"/><path d="M370 196 L370 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="196" r="2.5" fill="#2563eb"/><path d="M410 196 L410 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="196" r="2.5" fill="#2563eb"/><path d="M450 196 L450 224" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="450" cy="196" r="2.5" fill="#2563eb"/><path d="M330 210 Q240 160 120 130" fill="none" stroke="#c9a37a" stroke-width="6" /><rect x="200" y="138" width="70" height="26" rx="0" fill="#fef3c7" stroke="#e5c07b" stroke-width="1.2"/><polyline class="lead" points="235,151 40,330" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="334" text-anchor="start"><tspan x="44" dy="0">пластырь фиксирует</tspan><tspan x="44" dy="14">иглу и трубку к коже</tspan></text><polyline class="lead" points="330,210 420,300" marker-start="url(#dot)"/><text class="lbl sm" x="424" y="304" text-anchor="start"><tspan x="424" dy="0">швы на рану</tspan></text><text class="lbl sm" x="330" y="90" text-anchor="start" style="fill:#16a34a"><tspan x="330" dy="0">после переливания: иглу извлечь,</tspan><tspan x="330" dy="15">центральную лигатуру завязать окончательно</tspan></text><text class="ttl" x="18" y="28">Фиксация и завершение</text></svg>
