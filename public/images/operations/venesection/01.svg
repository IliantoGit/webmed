<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Выбор вены (медиальная поверхность голеностопа)">
<style>
  .lbl { font: 600 13px system-ui, 'Segoe UI', Arial, sans-serif; fill: #1f2d26;
          paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .sm  { font-size: 11.5px; font-weight: 500; }
  .ttl { font: 700 15px system-ui, 'Segoe UI', Arial, sans-serif; fill: #16a34a; }
  .lead { stroke: #1f2d26; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
    <circle cx="5" cy="5" r="4" fill="#1f2d26"/>
  </marker>
  <pattern id="fib" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fib2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="fibh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e7a59b"/><line x1="0" y1="4" x2="8" y2="4" stroke="#c46f62" stroke-width="1"/>
  </pattern>
  <pattern id="apo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <rect width="10" height="10" fill="#e6ecf3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#9fb0c3" stroke-width="0.8"/>
  </pattern>
  <pattern id="fatp" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#fde9b0"/><circle cx="7" cy="7" r="5" fill="none" stroke="#e8c766" stroke-width="0.8"/>
  </pattern>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff" fill-opacity="0.55"/><path d="M0 0 L8 8 M8 0 L0 8" stroke="#7aa6c9" stroke-width="0.7"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8edf2"/><stop offset="1" stop-color="#9aa7b4"/>
  </linearGradient>
</defs>
<rect width="640" height="400" rx="14" fill="#f2faf5"/><path d="M80 60 L200 60 Q210 230 230 280 Q260 330 400 330 L580 330 Q600 360 580 385 L200 385 Q120 380 100 300 Q80 200 80 60 Z" fill="#f6d5c3" stroke="#d9a58c" stroke-width="2" /><ellipse cx="180" cy="290" rx="34" ry="26" fill="#f5efe0" stroke="#b9a77f" stroke-width="2"/><path d="M150 60 Q165 200 230 270 Q300 320 520 340" fill="none" stroke="#3a6ea5" stroke-width="8" /><path d="M142 60 Q155 200 222 278 Q290 330 500 352" fill="none" stroke="#e9b824" stroke-width="3" /><path d="M215 250 L265 225" fill="none" stroke="#d62828" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/><polyline class="lead" points="180,290 30,370" marker-start="url(#dot)"/><text class="lbl sm" x="34" y="374" text-anchor="start"><tspan x="34" dy="0">медиальная лодыжка</tspan></text><polyline class="lead" points="160,150 300,90" marker-start="url(#dot)"/><text class="lbl" x="304" y="94" text-anchor="start"><tspan x="304" dy="0">v. saphena magna — впереди</tspan><tspan x="304" dy="14">медиальной лодыжки,</tspan><tspan x="304" dy="14">положение постоянно</tspan></text><polyline class="lead" points="150,190 300,190" marker-start="url(#dot)"/><text class="lbl sm" x="304" y="194" text-anchor="start"><tspan x="304" dy="0">n. saphenus рядом</tspan></text><polyline class="lead" points="240,238 330,250" marker-start="url(#dot)"/><text class="lbl sm" x="334" y="254" text-anchor="start"><tspan x="334" dy="0">разрез 3–4 см над</tspan><tspan x="334" dy="14">проекцией вены</tspan></text><text class="lbl sm" x="420" y="375" text-anchor="start" style="fill:#16a34a"><tspan x="420" dy="0">также: вены локтевой ямки, предплечья</tspan></text><text class="ttl" x="18" y="28">Выбор вены (медиальная поверхность голеностопа)</text></svg>
