<rect width="640" height="400" rx="14" fill="#f2faf5"/><g><ellipse cx="320" cy="215" rx="256" ry="127" fill="#f6d5c3" stroke="#d9a58c" stroke-width="2"/><ellipse cx="320" cy="215" rx="240" ry="113" fill="url(#fatp)"/><ellipse cx="320" cy="215" rx="230" ry="105" fill="url(#apo)" stroke="#e8c766" stroke-width="1.5"/></g><path d="M120 120 Q200 215 150 320" fill="none" stroke="#d62828" stroke-width="3" /><path d="M470 110 Q430 215 500 320" fill="none" stroke="#3a6ea5" stroke-width="3" /><g transform="translate(150 165) rotate(200) scale(0.55)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><g transform="translate(145 270) rotate(160) scale(0.55)"><circle cx="-150" cy="-14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><circle cx="-150" cy="14" r="10" fill="none" stroke="#5f6b78" stroke-width="3"/><path d="M-142 -10 L-60 2 L-25 -2 L0 -1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><path d="M-142 10 L-60 -2 L-25 2 L0 1" fill="none" stroke="#5f6b78" stroke-width="3.5"/><circle cx="-60" cy="0" r="3" fill="#1f2d26"/><path d="M-135 -6 l8 6 l-8 6" stroke="#5f6b78" fill="none" stroke-width="1.5"/></g><line x1="130" y1="205" x2="168" y2="212" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="149.0" cy="208.5" r="4" fill="#2563eb"/><polyline class="lead" points="150,165 40,60" marker-start="url(#dot)"/><text class="lbl" x="44" y="64" text-anchor="start"><tspan x="44" dy="0">a. et v. epigastricae</tspan><tspan x="44" dy="14">superficiales — пересечь</tspan><tspan x="44" dy="14">между зажимами</tspan></text><polyline class="lead" points