ill="#2563eb"/><path d="M360 195 Q375 255 360 310" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="195" r="3" fill="#2563eb"/><path d="M405 195 Q420 255 405 310" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="405" cy="195" r="3" fill="#2563eb"/><polyline class="lead" points="480,230 440,70" marker-start="url(#dot)"/><text class="lbl sm" x="444" y="74" text-anchor="start"><tspan x="444" dy="0">влагалище прямой мышцы →</tspan><tspan x="444" dy="14">гребенчатая (куперова)</tspan><tspan x="444" dy="14">связка: 3–4 шва</tspan></text><polyline class="lead" points="330,220 40,70" marker-start="url(#dot)"/><text class="lbl sm" x="44" y="74" text-anchor="start"><tspan x="44" dy="0">поперечная мышца + фасция</tspan><tspan x="44" dy="14">→ паховая связка: 3–5 швов</tspan></text><text class="ttl" x="18" y="28">Прямая грыжа: способ Кукуджанова</text></svg>
